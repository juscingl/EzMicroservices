services:
  postgres:
    image: postgres:16
    container_name: eztrade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ordersdb}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # 首次创建数据卷时，02 号脚本会读取此处 SQL 并分别导入 auth/orders/inventory/payments 库
      - ./deploy/sql:/eztrade-deploy-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ordersdb}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
